# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # schedule:
  # Automatic execution every 12 hours: 00:00 and 12:00 UTC
  #   - cron: '0 0 * * *'
  #   - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      runPerformanceTests:
        description: "Exécuter les tests de performance (TestPerformance)"
        required: false
        default: "false"

jobs:
  build:
    name: Build, Test (and optional Perf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TourGuide
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Install local libs
        run: |
          mvn install:install-file -Dfile=libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar
          mvn install:install-file -Dfile=libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar
          mvn install:install-file -Dfile=libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar

      - name: Build, test and package
        run: mvn -B -ntp package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: TourGuide/target/*.jar

      - name: Run Performance Tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runPerformanceTests == 'true' }}
        env:
          MAVEN_OPTS: -Xmx2g
        run: mvn -Dtest=TestPerformance -Dsurefire.timeout=0 test

      - name: Archive surefire reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.runPerformanceTests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: TourGuide/target/surefire-reports/**
